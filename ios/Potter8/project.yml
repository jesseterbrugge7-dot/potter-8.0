name: Potter8
options:
  bundleIdPrefix: com.potter8
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "8.0.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
targets:
  Potter8:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potter8.app
        PRODUCT_NAME: Potter 8.0
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Potter 8.0
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Potter connects to your own Potter server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  Potter8:
    build:
      targets:
        Potter8: all
    run:
      config: Debug
    archive:
      config: Release
