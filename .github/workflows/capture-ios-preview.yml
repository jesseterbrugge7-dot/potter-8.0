name: Capture Potter iOS preview

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture on iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Potter
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select and boot an iPhone Simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"

          if [[ -z "$device_id" ]]; then
            runtime_id="$(xcrun simctl list runtimes available --json | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains(".iOS-")))][-1].identifier // empty')"
            device_type="$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))][0].identifier // empty')"

            if [[ -z "$runtime_id" || -z "$device_type" ]]; then
              echo "No available iOS Simulator runtime or iPhone device type was found." >&2
              xcrun simctl list
              exit 1
            fi

            device_id="$(xcrun simctl create 'Potter Preview' "$device_type" "$runtime_id")"
          fi

          device_state="$(xcrun simctl list devices --json | jq -r --arg id "$device_id" '[.devices[][] | select(.udid == $id)][0].state // empty')"
          if [[ "$device_state" != "Booted" ]]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl ui "$device_id" appearance light
          xcrun simctl status_bar "$device_id" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Build and launch Potter
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          cd ios/Potter8
          xcodegen generate
          xcodebuild \
            -project Potter8.xcodeproj \
            -scheme Potter8 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/PotterPreviewDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          app_bundle="$(find "$RUNNER_TEMP/PotterPreviewDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "Xcode did not produce a Simulator app bundle." >&2
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" "$app_bundle"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.potter8.app
          sleep 4

      - name: Capture preview
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          mkdir -p docs
          xcrun simctl io "$DEVICE_ID" screenshot --type=png docs/Potter-8.0-iOS-preview.png

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Potter-8.0-iOS-preview
          path: docs/Potter-8.0-iOS-preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Add preview to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Potter-8.0-iOS-preview.png
          if git diff --cached --quiet; then
            echo 'Preview is unchanged.'
          else
            git commit -m 'Add Potter iOS preview'
            git push
          fi
