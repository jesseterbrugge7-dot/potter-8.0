name: Build unsigned Potter IPA

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Potter
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Potter-8.0-unsigned-IPA
          path: dist/Potter-8.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "potter-8.0-private-${GITHUB_RUN_ID}" \
            dist/Potter-8.0-unsigned.ipa \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Potter 8.0 private IPA" \
            --notes "Unsigned personal-install build. Sign it locally with your own Apple Account before installing."
